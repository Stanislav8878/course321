services:
  db:
    image: postgres:16-alpine
    volumes:
      - course321_pgdata:/var/lib/postgresql/data
    env_file:
      - .env
    ports:
      - "${POSTGRES_PORT}:5432"

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  web:
    build:
      context: .
      dockerfile: docker/backend/Dockerfile
    command: gunicorn config.wsgi:application --bind 0.0.0.0:8000
    volumes:
      - .:/app
      - course321_static_volume:/static
      - course321_media_volume:/media
    env_file:
      - .env
    depends_on:
      - db
      - redis

  celery:
    build:
      context: .
      dockerfile: docker/backend/Dockerfile
    command: celery -A config worker -l info
    volumes:
      - .:/app
      - course321_static_volume:/static
      - course321_media_volume:/media
    env_file:
      - .env
    depends_on:
      - db
      - redis

  celery_beat:
    build:
      context: .
      dockerfile: docker/backend/Dockerfile
    command: celery -A config beat -l info
    volumes:
      - .:/app
      - course321_static_volume:/static
      - course321_media_volume:/media
    env_file:
      - .env
    depends_on:
      - db
      - redis

  nginx:
    image: nginx:1.27-alpine
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/conf.d/default.conf
      - course321_static_volume:/static
      - course321_media_volume:/media
    ports:
      - "80:80"
    depends_on:
      - web

volumes:
  course321_static_volume:
  course321_media_volume:
  course321_pgdata: