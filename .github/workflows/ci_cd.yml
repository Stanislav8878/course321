name: CI/CD

on:
  push:

jobs:
  tests:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: habits
          POSTGRES_USER: habits
          POSTGRES_PASSWORD: habits
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U habits -d habits"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=20

    env:
      SECRET_KEY: test_secret_key
      DEBUG: "False"
      ALLOWED_HOSTS: "localhost,127.0.0.1"
      DB_NAME: habits
      DB_USER: habits
      DB_PASSWORD: habits
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      CELERY_BROKER_URL: redis://127.0.0.1:6379/1
      CELERY_RESULT_BACKEND: redis://127.0.0.1:6379/2

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Convert requirements.txt (UTF-16 -> UTF-8) and install deps
        run: |
          python -c "from pathlib import Path; p=Path('requirements.txt'); b=p.read_bytes(); \
          is_utf16 = b[:2] in (b'\xff\xfe', b'\xfe\xff'); \
          txt = b.decode('utf-16') if is_utf16 else b.decode('utf-8', errors='ignore'); \
          Path('requirements.utf8.txt').write_text(txt, encoding='utf-8')"
          python -m pip install --upgrade pip
          pip install -r requirements.utf8.txt

      - name: Run tests
        run: pytest -v

  build_and_deploy:
    needs: tests
    runs-on: ubuntu-latest

    # деплой только в develop
    if: github.ref == 'refs/heads/develop'

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image to GHCR
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ github.sha }}

      - name: Upload production compose + nginx config to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          port: ${{ secrets.SSH_PORT }}
          key: ${{ secrets.SSH_KEY }}
          source: "docker-compose.prod.yml,deploy/nginx.conf"
          target: "${{ secrets.APP_DIR }}"

      - name: Deploy on server (docker compose pull + up)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          port: ${{ secrets.SSH_PORT }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            set -e
            cd "${{ secrets.APP_DIR }}"
            docker compose -f docker-compose.prod.yml pull
            docker compose -f docker-compose.prod.yml up -d --remove-orphans
            docker image prune -f
