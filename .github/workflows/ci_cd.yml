name: CI/CD

on:
  push:
    branches: [ "develop" ]
  pull_request:
    branches: [ "develop" ]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: habits_db
          POSTGRES_USER: habits_user
          POSTGRES_PASSWORD: strong_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U habits_user -d habits_db"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      # Django
      SECRET_KEY: "ci-secret-key"
      DEBUG: "False"
      ALLOWED_HOSTS: "localhost,127.0.0.1"

      # DB for Django (pytest)
      DB_NAME: habits_db
      DB_USER: habits_user
      DB_PASSWORD: strong_password
      DB_HOST: 127.0.0.1
      DB_PORT: 5432

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: |
          pytest -q

  # Если деплой тебе реально нужен — оставь блок ниже.
  # Если пока мешает — можно временно убрать job deploy.
  deploy:
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/develop'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e
            mkdir -p /opt/habit-tracker
            cd /opt/habit-tracker

            # тут должен быть проект на сервере (git clone/pull) — добавь под себя
            # например:
            # if [ ! -d ".git" ]; then
            #   git clone <HTTPS_OR_SSH_URL> .
            # else
            #   git pull origin develop
            # fi

            docker compose -f docker-compose.prod.yml --env-file .env up -d --build