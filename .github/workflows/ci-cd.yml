name: CI/CD

on:
  push:
    branches: ["develop"]
  pull_request:
    branches: ["develop"]

jobs:
  test_and_lint:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: habits
          POSTGRES_USER: habits
          POSTGRES_PASSWORD: habits
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U habits"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379

    env:
      SECRET_KEY: test-secret-key
      DEBUG: "1"

      POSTGRES_DB: habits
      POSTGRES_USER: habits
      POSTGRES_PASSWORD: habits
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: 5432

      CELERY_BROKER_URL: redis://127.0.0.1:6379/0
      CELERY_RESULT_BACKEND: redis://127.0.0.1:6379/1

      TIME_ZONE: Europe/Moscow

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Lint (flake8)
        run: |
          flake8

      - name: Run migrations
        run: |
          python manage.py migrate --noinput

      - name: Run tests
        run: |
          pytest -q

  docker_build:
    runs-on: ubuntu-latest
    needs: [test_and_lint]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build images (compose prod)
        run: |
          docker compose -f docker-compose.prod.yml build

  deploy:
    runs-on: ubuntu-latest
    needs: [docker_build]
    if: github.event_name == 'push'

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            set -euo pipefail

            APP_DIR="${{ secrets.SSH_PATH }}"
            if [ -z "${APP_DIR:-}" ]; then APP_DIR="$HOME/course321"; fi

            echo "Deploy to $APP_DIR"

            # если папки нет — клонируем
            if [ ! -d "$APP_DIR/.git" ]; then
              rm -rf "$APP_DIR"
              git clone "${{ github.server_url }}/${{ github.repository }}.git" "$APP_DIR"
            fi

            cd "$APP_DIR"

            # ЖЁСТКО синхронизируемся с репозиторием (фикс твоей ошибки)
            git fetch --all --prune
            git checkout develop || git checkout -b develop
            git reset --hard origin/develop
            git clean -fd

            # записываем .env
            printf '%s' "${{ secrets.ENV_FILE }}" > .env

            # деплой
            docker compose -f docker-compose.prod.yml up -d --build

            # миграции + статика
            docker compose -f docker-compose.prod.yml exec -T web python manage.py migrate --noinput
            docker compose -f docker-compose.prod.yml exec -T web python manage.py collectstatic --noinput

            # очистка
            docker image prune -f